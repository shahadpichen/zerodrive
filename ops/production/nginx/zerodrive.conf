map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Reject unknown Host headers rather than serving ZeroDrive under an
# attacker-controlled hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/zerodrive.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodrive.xyz/privkey.pem;
    return 444;
}

# ACME renewal and canonical HTTPS redirects.
server {
    listen 80;
    listen [::]:80;
    server_name zerodrive.xyz www.zerodrive.xyz api.zerodrive.xyz files.zerodrive.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerodrive.xyz;

    ssl_certificate /etc/letsencrypt/live/zerodrive.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodrive.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zerodrive.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zerodrive.xyz;

    ssl_certificate /etc/letsencrypt/live/zerodrive.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodrive.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zerodrive.xyz;

    ssl_certificate /etc/letsencrypt/live/zerodrive.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodrive.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.zerodrive.xyz;

    ssl_certificate /etc/letsencrypt/live/zerodrive.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodrive.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared files are already encrypted before they reach this endpoint.
    # Stream requests instead of buffering large encrypted objects on disk.
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_buffering off;

    location = /minio/health/live {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Presigned shared-file URLs use path-style requests for this bucket.
    # Do not expose unrelated MinIO API or administrative paths publicly.
    location ^~ /zerodrive-files/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
