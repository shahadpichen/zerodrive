# Temporary HTTP-only configuration used to obtain the first Let's Encrypt
# certificate. Replace this site with zerodrive.conf after certbot succeeds.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name zerodrive.xyz www.zerodrive.xyz api.zerodrive.xyz files.zerodrive.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 200 "ZeroDrive TLS bootstrap\n";
        add_header Content-Type text/plain;
    }
}
