map $uri $zerodrive_robots {
    default "";
    ~^/(?:home|storage|share|shared-with-me|recovery-access|key-management)(?:/|$) "noindex, nofollow, noarchive";
    ~^/admin(?:/|$) "noindex, nofollow, noarchive";
    ~^/oauth(?:/|$) "noindex, nofollow, noarchive";
    ~^/docs/.+\.md$ "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Public pages are complete build-time HTML documents.
    location = / {
        try_files /index.html =404;
    }

    location = /docs {
        try_files /docs/index.html =404;
    }

    location ~ ^/docs/[a-z0-9-]+/?$ {
        try_files $uri/index.html $uri =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /terms {
        try_files /terms/index.html =404;
    }

    location = /how-it-works {
        return 301 /docs/how-it-works;
    }

    # Authenticated routes use the client application and are never indexable.
    location ~ ^/(?:home|storage|share|shared-with-me|recovery-access|key-management)(?:/|$) {
        try_files /app.html =404;
    }

    location ~ ^/admin(?:/|$) {
        try_files /app.html =404;
    }

    location ~ ^/oauth(?:/|$) {
        try_files /app.html =404;
    }

    # Prevent direct API calls (they must go through the API deployment).
    location /api {
        return 404;
    }

    # PDF.js loads this file as a module worker. Alpine nginx does not map the
    # .mjs extension in every release, and nosniff correctly rejects the
    # application/octet-stream fallback.
    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Static assets and discovery files. Unknown routes are real 404s.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security and crawler headers remain inherited by every location.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag $zerodrive_robots always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' https://api.zerodrive.xyz https://files.zerodrive.xyz https://www.googleapis.com https://apis.google.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com" always;
}
